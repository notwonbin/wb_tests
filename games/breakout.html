<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breakout — Playroom</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="page">
    <nav class="bar"><a href="../index.html">← Playroom</a><span class="muted">Arcade</span></nav>

    <section class="stage-tile">
      <div class="center">
        <canvas id="c" width="520" height="400"></canvas>
        <p class="hint">마우스 · 터치 · ← → 로 이동 / 클릭 또는 Space로 발사</p>
      </div>
    </section>

    <div class="game-info">
      <div><p class="sub">Playroom · Arcade</p><p class="name">Breakout</p></div>
      <div class="stats"><span>Score<b id="score">0</b></span><span>Life<b id="life">3</b></span><span>Best<b id="best">0</b></span></div>
    </div>
  </main>

  <script src="../js/score.js"></script>
  <script>
    const cv = document.getElementById('c'), ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    const $ = id => document.getElementById(id);
    $('best').textContent = Score.get('breakout');
    const FONT = '"Pretendard", -apple-system, sans-serif';

    const ROWS = 5, COLS = 8, BW = 54, BH = 18, GAP = 6, TOP = 44;
    const LEFT = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;
    const COLORS = ['#ff5a1f', '#e9e3d8', '#2f5d3a', '#cfcfd4', '#8b6cf6'];

    let paddle, ball, bricks, score, life, launched, state, keys = {};

    function newGame() {
      score = 0; life = 3; state = 'play';
      bricks = [];
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
        bricks.push({ x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP), color: COLORS[r], alive: true, pts: (ROWS - r) * 10 });
      paddle = { w: 84, h: 8, x: W / 2 - 42, y: H - 30 };
      resetBall(); hud();
    }
    function resetBall() {
      launched = false;
      ball = { r: 6, x: paddle.x + paddle.w / 2, y: paddle.y - 8, vx: 0, vy: 0 };
    }
    function launch() {
      if (state !== 'play') { newGame(); return; }
      if (launched) return;
      launched = true;
      ball.vx = (Math.random() < .5 ? -1 : 1) * 3; ball.vy = -4.5;
    }
    function hud() { $('score').textContent = score; $('life').textContent = life; }

    function update() {
      if (keys.ArrowLeft) paddle.x -= 7;
      if (keys.ArrowRight) paddle.x += 7;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
      if (state !== 'play') return;
      if (!launched) { ball.x = paddle.x + paddle.w / 2; return; }

      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.x < ball.r || ball.x > W - ball.r) ball.vx *= -1;
      if (ball.y < ball.r) ball.vy *= -1;

      if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y < paddle.y + paddle.h &&
          ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.1, 8);
        ball.vx = speed * hit * 0.9;
        ball.vy = -Math.sqrt(speed * speed - ball.vx * ball.vx);
      }

      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x > b.x - ball.r && ball.x < b.x + BW + ball.r && ball.y > b.y - ball.r && ball.y < b.y + BH + ball.r) {
          b.alive = false; ball.vy *= -1; score += b.pts; hud();
          break;
        }
      }

      if (bricks.every(b => !b.alive)) end('Cleared');
      if (ball.y > H + 20) {
        life--; hud();
        if (life <= 0) end('Game over'); else resetBall();
      }
    }
    function end(msg) {
      state = msg;
      if (Score.submitHigh('breakout', score)) $('best').textContent = score;
    }
    function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
    function draw() {
      ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, W, H);
      bricks.forEach(b => { if (b.alive) { ctx.fillStyle = b.color; rr(b.x, b.y, BW, BH, 3); } });
      ctx.fillStyle = '#161616'; rr(paddle.x, paddle.y, paddle.w, paddle.h, 4);
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
      ctx.textAlign = 'center';
      if (state !== 'play') {
        ctx.fillStyle = 'rgba(250,250,250,.88)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#161616'; ctx.font = `500 22px ${FONT}`; ctx.fillText(state, W / 2, H / 2);
        ctx.fillStyle = '#8d8d93'; ctx.font = `400 12px ${FONT}`; ctx.fillText(`Score ${score} — click to retry`, W / 2, H / 2 + 26);
      } else if (!launched) {
        ctx.fillStyle = '#8d8d93'; ctx.font = `400 12px ${FONT}`;
        ctx.fillText('Click or Space to launch', W / 2, H / 2 + 50);
      }
    }
    function loop() { update(); draw(); requestAnimationFrame(loop); }

    function movePointer(clientX) {
      const rect = cv.getBoundingClientRect();
      paddle.x = (clientX - rect.left) * (W / rect.width) - paddle.w / 2;
    }
    cv.addEventListener('mousemove', e => movePointer(e.clientX));
    cv.addEventListener('touchmove', e => { e.preventDefault(); movePointer(e.touches[0].clientX); }, { passive: false });
    cv.addEventListener('click', launch);
    cv.addEventListener('touchstart', e => { movePointer(e.touches[0].clientX); launch(); }, { passive: true });
    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.code === 'Space') { e.preventDefault(); launch(); }
    });
    document.addEventListener('keyup', e => { keys[e.key] = false; });

    newGame(); loop();
  </script>
</body>
</html>
